<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Tema antes de pintar: sem isto o app abre escuro e so depois clareia.
  // Status bar do iPhone: texto branco (black-translucent) so no escuro.
  (function () {
    var th = 'dark';
    try { th = JSON.parse(localStorage.getItem('gymlog.settings') || '{}').theme || 'dark'; } catch (e) {}
    if (th !== 'light' && th !== 'sand') return;
    document.documentElement.setAttribute('data-theme', th);
    document.querySelector('meta[name="theme-color"]').content = th === 'sand' ? '#f1ebe0' : '#f2f3f6';
    document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'default';
  })();
</script>
</head>
<body>

<header id="topbar">
  <button id="back" class="icon-btn" hidden aria-label="Back">&#8592;</button>
  <h1 id="title">Gym Log</h1>
  <button id="sync-badge" class="badge" hidden></button>
  <button id="theme-btn" class="theme-btn" aria-label="Theme" aria-haspopup="true">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
  </button>
  <div id="lang-toggle" class="lang-toggle">
    <button id="lang-pt" aria-label="Português">🇧🇷 PT</button>
    <button id="lang-en" aria-label="English">🇺🇸 EN</button>
  </div>
  <div id="theme-menu" class="theme-menu" hidden>
    <button id="theme-dark"><span class="swatch dark"></span><span id="theme-dark-label">Dark</span></button>
    <button id="theme-light"><span class="swatch light"></span><span id="theme-light-label">Light</span></button>
    <button id="theme-sand"><span class="swatch sand"></span><span id="theme-sand-label">Sand</span></button>
  </div>
</header>

<main>

  <!-- ---------- HOME ---------- -->
  <section id="screen-home" class="screen">
    <button id="start" class="hero">
      <span class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
      </span>
      <span class="hero-text">
        <span id="start-label" class="hero-title">Start Workout</span>
        <span id="start-sub" class="hero-sub"></span>
      </span>
      <span class="hero-chevron" aria-hidden="true">&#8250;</span>
    </button>
    <button id="resume" class="hero resume" hidden>
      <span class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
      </span>
      <span class="hero-text">
        <span id="resume-label" class="hero-title">Continue Workout</span>
        <span id="resume-sub" class="hero-sub"></span>
      </span>
      <span class="hero-chevron" aria-hidden="true">&#8250;</span>
    </button>

    <div class="tiles">
      <button id="open-history" class="tile">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
        </span>
        <span id="open-history-label" class="tile-title">Previous Workouts</span>
        <span id="history-sub" class="tile-sub"></span>
      </button>
      <button id="open-library" class="tile">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        </span>
        <span id="open-library-label" class="tile-title">Exercises</span>
        <span id="library-sub" class="tile-sub"></span>
      </button>
    </div>

    <div class="spacer"></div>
    <button id="open-settings" class="link">Settings</button>
  </section>

  <!-- ---------- SESSAO ---------- -->
  <section id="screen-session" class="screen">
    <p id="session-date" class="muted"></p>
    <ul id="entry-list" class="list"></ul>
    <p id="entry-empty" class="muted center">No exercises logged yet.</p>
    <div class="sticky-bottom">
      <button id="add-exercise" class="big primary">+ ADD EXERCISE</button>
      <button id="finish" class="big ghost">FINISH WORKOUT</button>
      <button id="discard" class="link danger">Discard workout</button>
    </div>
  </section>

  <!-- ---------- HISTORICO ---------- -->
  <section id="screen-history" class="screen">
    <ul id="history-list" class="list"></ul>
    <p id="history-empty" class="muted center">No finished workouts yet.</p>
  </section>

  <!-- ---------- TREINO ANTIGO (so leitura) ---------- -->
  <section id="screen-workout" class="screen">
    <p id="workout-date" class="muted"></p>
    <ul id="workout-list" class="list"></ul>
  </section>

  <!-- ---------- GRUPO ---------- -->
  <section id="screen-group" class="screen">
    <div id="group-grid" class="groups"></div>
  </section>

  <!-- ---------- EXERCICIO ---------- -->
  <section id="screen-exercise" class="screen">
    <input id="search" type="search" placeholder="Search exercise..." autocomplete="off">
    <div id="exercise-list" class="list"></div>
    <button id="custom-exercise" class="big ghost">Other exercise (type it)</button>
  </section>

  <!-- ---------- HISTORICO DE UM EXERCICIO (pela lista de consulta) ---------- -->
  <section id="screen-ex-history" class="screen">
    <h2 id="xh-name"></h2>
    <p id="xh-meta" class="xh-meta"></p>
    <ul id="xh-list" class="list"></ul>
    <p id="xh-empty" class="muted center">Not logged on this device yet.</p>
  </section>

  <!-- ---------- FORMULARIO ---------- -->
  <section id="screen-form" class="screen">
    <h2 id="form-exercise"></h2>
    <p id="form-group" class="muted"></p>

    <div id="custom-fields" hidden>
      <label><span id="l-name">Exercise name</span>
        <input id="f-name" type="text" autocapitalize="words">
      </label>
      <label><span id="l-group">Group 1</span>
        <select id="f-group"></select>
      </label>
      <label><span id="l-group2">Group 2</span>
        <select id="f-group2"></select>
      </label>
      <label><span id="l-group0">Group 0 (category)</span>
        <select id="f-group0"></select>
      </label>
    </div>

    <button id="last-chip" class="chip" hidden></button>

    <div class="row">
      <label><span id="l-sets">Sets</span>
        <input id="f-sets" type="text" inputmode="numeric" enterkeyhint="next" placeholder="e.g. 3">
      </label>
      <label><span id="l-reps">Reps / Time</span>
        <input id="f-reps" type="text" inputmode="text" enterkeyhint="next" placeholder="e.g. 10 or 30s">
      </label>
    </div>

    <div class="row">
      <label><span id="l-weight">Weight / Load</span>
        <input id="f-weight" type="text" inputmode="text" enterkeyhint="next" placeholder="e.g. 10kg">
      </label>
      <label><span id="l-rpe">RPE</span>
        <input id="f-rpe" type="text" inputmode="numeric" enterkeyhint="next" placeholder="e.g. 7">
      </label>
    </div>

    <label><span id="l-notes">Notes</span>
      <input id="f-notes" type="text" autocapitalize="sentences" enterkeyhint="done" placeholder="e.g. last set felt easy">
    </label>

    <div class="sticky-bottom">
      <button id="save-entry" class="big primary">SAVE</button>
      <button id="delete-entry" class="big danger" hidden>DELETE</button>
    </div>
  </section>

  <!-- ---------- CONFIGURACOES ---------- -->
  <section id="screen-settings" class="screen">
    <label><span id="l-lang">Language</span>
      <select id="s-lang">
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </label>
    <hr>
    <p id="settings-intro" class="muted">
      Paste the Apps Script Web App URL and the token here. They are stored only
      on this device and never go to the repository.
    </p>
    <label><span id="l-url">Apps Script URL (/exec)</span>
      <input id="s-url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <label><span id="l-token">Token</span>
      <input id="s-token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <button id="save-settings" class="big primary">SAVE</button>
    <button id="test-sync" class="big ghost">TEST CONNECTION</button>
    <p id="settings-status" class="muted"></p>
    <hr>
    <p class="muted" id="queue-info"></p>
    <button id="force-sync" class="big ghost">SYNC NOW</button>
    <button id="export-json" class="link">Export backup (JSON)</button>
  </section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
